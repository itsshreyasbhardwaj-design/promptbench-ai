version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Grouped so a routine week is one reviewable PR rather than fifteen.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]
    ignore:
      # Next and React majors change framework behaviour; they get a deliberate
      # upgrade PR with the E2E suite as the gate, not an automated bump.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
